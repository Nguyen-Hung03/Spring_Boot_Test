<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Salary Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page-wrap">
    <section class="panel">
        <div class="panel-heading">User</div>
        <div class="panel-body">
            <div class="alert alert-success" th:if="${success}" th:text="${success}">User created successfully</div>
            <div class="alert alert-danger" th:if="${error}" th:text="${error}">Error while creating User</div>
            <div class="alert alert-danger d-none" id="clientError"></div>

            <form id="userForm" th:action="@{/users/save}" th:object="${user}" method="post" novalidate>
                <input type="hidden" th:field="*{id}">
                <input type="hidden" name="keyword" th:value="${keyword}">

                <div class="field-row">
                    <label for="name">Name</label>
                    <div class="field-control">
                        <input class="form-control" type="text" th:field="*{name}" placeholder="Enter your name">
                        <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name is required</div>
                    </div>
                </div>

                <div class="field-row">
                    <label for="age">Age</label>
                    <div class="field-control">
                        <input class="form-control" type="number" min="1" max="120" th:field="*{age}" placeholder="Enter your Age">
                        <div class="field-error" th:if="${#fields.hasErrors('age')}" th:errors="*{age}">Age is required</div>
                    </div>
                </div>

                <div class="field-row">
                    <label for="salary">Salary</label>
                    <div class="field-control">
                        <input class="form-control" type="number" min="1" th:field="*{salary}" placeholder="Enter your Salary">
                        <div class="field-error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}">Salary is required</div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" th:text="${isEdit} ? 'Update' : 'Add'">Add</button>
                    <a class="btn btn-warning" th:href="@{/}">Reset Form</a>
                </div>
            </form>
        </div>
    </section>

    <section class="panel">
        <div class="panel-heading">List of Users</div>
        <div class="panel-body">
            <form class="search-form" method="get" th:action="@{/}">
                <input class="form-control" type="text" name="keyword" th:value="${keyword}" placeholder="Search by name, age or salary">
                <button type="submit" class="btn btn-info text-white">Search</button>
                <a class="btn btn-outline-secondary" th:href="@{/}">Clear</a>
            </form>
            <p class="search-result" th:if="${!#strings.isEmpty(keyword)}">
                Found <strong th:text="${users.size()}">0</strong> user(s) matching
                "<span th:text="${keyword}">Bob</span>"
            </p>

            <div class="table-responsive">
                <table class="table user-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>NAME</th>
                        <th>AGE</th>
                        <th>SALARY</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${users.isEmpty()}">
                        <td colspan="5" class="empty-row">No users found.</td>
                    </tr>
                    <tr th:each="item : ${users}">
                        <td th:text="${item.id}">1</td>
                        <td th:text="${item.name}">Sam</td>
                        <td th:text="${item.age}">30</td>
                        <td th:text="${item.salary}">70000</td>
                        <td class="actions">
                            <a class="btn btn-success btn-sm" th:href="@{/users/edit/{id}(id=${item.id}, keyword=${keyword})}">Edit</a>
                            <form class="d-inline" th:action="@{/users/delete/{id}(id=${item.id})}" method="post">
                                <button type="submit" class="btn btn-danger btn-sm btn-remove">Remove</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
